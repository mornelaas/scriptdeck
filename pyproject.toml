[project]
name = "scriptdeck"
version = "0.1.0"
description = "Backend of a content manager for creators - learning sandbox"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
scriptdeck = "scriptdeck.cli:app"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors (spacing, blank lines)
    "W",      # pycodestyle warnings
    "F",      # pyflakes (unused imports, undefined names)
    "I",      # isort (import ordering and grouping)
    "A",      # flake8-builtins (shadowing builtins like id)
    "UP",     # pyupgrade (modernize old syntax)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "faker>=40.43.0",
    "pre-commit>=4.6.2",
    "ruff>=0.17.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/scriptdeck"]
